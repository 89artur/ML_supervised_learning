name: Convert and Deploy Notebook
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert

      - name: Convert notebook to HTML
        run: |
          jupyter nbconvert --to html master/ML_supervised_learning_project.ipynb \
            --output-dir master/ \
            --output notebook.html  # Переименовываем для главной страницы

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact (v4)
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'master/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2