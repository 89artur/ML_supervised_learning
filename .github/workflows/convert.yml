name: Convert and Deploy Notebook
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert

      - name: Convert notebook to HTML
        run: |
          jupyter nbconvert --to html master/ML_supervised_learning_project.ipynb --output-dir ./  # Генерируем HTML в корень

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # Публикуем корневую папку
          publish_branch: gh-pages  # Специальная ветка для Pages
          keep_files: true  # Сохраняет предыдущие файлы в ветке
