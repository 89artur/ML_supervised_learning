name: Convert Notebook to HTML
on: [push]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -R
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install nbconvert
          pip install jupyter
      - name: Convert notebook
        run: jupyter nbconvert --to html --no-input --ExecutePreprocessor.timeout=600 ML_supervised_learning_project.ipynb
      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: notebook-html
          path: ML_supervised_learning_project.html
