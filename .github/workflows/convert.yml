name: Convert and Deploy Notebook
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Добавляем разрешение на запись
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно для работы с gh-pages

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert

      - name: Convert notebook to HTML
        run: |
          jupyter nbconvert --to html master/ML_supervised_learning_project.ipynb --output-dir ./
          mv ML_supervised_learning_project.html index.html  # Переименовываем для главной страницы

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true  # Очищает ветку перед деплоем